[package]
name = "browser-workload-runner"
version.workspace = true
description = "Browser workload rendering the schemaform Dioxus adapter under measurement"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
browser-workload-pack = { workspace = true }
schemaform = { workspace = true }
schemaform-dioxus = { workspace = true }

dioxus = { workspace = true }
dioxus-web = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Performance", "Window"] }
