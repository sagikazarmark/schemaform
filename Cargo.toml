[workspace]
members = [
    "crates/*",
    "testing/browser/pack",
    "testing/browser/empty-shell",
    "testing/browser/runner",
    "testing/toolchain",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/schemaform"
homepage = "https://github.com/sagikazarmark/schemaform"

[workspace.dependencies]
browser-workload-pack = { path = "testing/browser/pack" }
schemaform = { path = "crates/schemaform", version = "0.1.0" }
schemaform-dioxus = { path = "crates/schemaform-dioxus", version = "0.1.0" }

dioxus = { version = "=0.7.10", default-features = false, features = ["hooks", "html", "macro", "signals"] }
dioxus-core = "=0.7.10"
dioxus-elements = { package = "dioxus-html", version = "=0.7.10" }
dioxus-signals = "=0.7.10"
dioxus-web = { version = "=0.7.10", default-features = false }
# The wasm-bindgen stack and serde_json are minimum requirements, not exact
# pins: the published crates must resolve alongside whatever version a
# consumer's other dependencies already lock, and cargo refuses rather than
# downgrades when a locked version meets a new exact requirement. The versions
# this workspace builds, tests, and fuzzes with are the lockfile's, which CI
# holds with `--locked`; the browser test runner must match the *locked*
# wasm-bindgen. `jsonschema` and `referencing` stay exact: their releases
# change validation behaviour, and almost no consumer depends on them
# independently. The qualified set is asserted by
# `crates/schemaform/tests/validator_configuration_target.rs`.
js-sys = "0.3.103"
jsonptr = "0.8.1"
jsonschema = { version = "=0.52.1", default-features = false, features = ["arbitrary-precision"] }
num-bigint = "0.5.1"
proptest = "1.7.0"
referencing = "=0.52.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
wasm-bindgen-test = "0.3.76"
web-sys = "0.3.103"

[workspace.metadata.release]
release = false
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
