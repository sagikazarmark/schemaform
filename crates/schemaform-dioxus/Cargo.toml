[package]
name = "schemaform-dioxus"
version.workspace = true
description = "Client-side Dioxus adapter for runtime JSON Schema forms"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
schemaform = { workspace = true }

# `document` provides `document::eval`, the platform-neutral bridge every DOM touch (focus,
# rejected-write resynchronisation) goes through. The host's renderer must supply a `Document`
# provider; `dioxus-web` does so behind its `document` feature, which is on by default.
dioxus = { workspace = true, features = ["document"] }
dioxus-core = { workspace = true }
dioxus-elements = { workspace = true }
dioxus-signals = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
browser-workload-pack = { workspace = true }

dioxus-web = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
    "CompositionEvent",
    "CompositionEventInit",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlIFrameElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "InputEvent",
    "InputEventInit",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Location",
    "Node",
    "NodeList",
    "Window",
] }

[package.metadata.release]
release = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(schemaform_test_validation_faults)"] }
