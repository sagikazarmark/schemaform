version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      # The validator is pinned to a qualified release, so a bump fails CI until it is
      # requalified. Keep it apart so it never holds back the rest of the cargo updates.
      # A dependency joins the first group it matches, so this group comes first.
      validator:
        patterns:
          - "jsonschema"
          - "referencing"
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/release.yml
      - .github/workflows/dagger.yaml
      - .github/workflows/dagger-*.yaml
