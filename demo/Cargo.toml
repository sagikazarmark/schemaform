[package]
name = "demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
schemaform = { path = "../crates/schemaform" }
schemaform-dioxus = { path = "../crates/schemaform-dioxus" }

dioxus = { version = "=0.7.10", default-features = false, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "launch",
    "macro",
    # The registry's `Input` focuses its native element through `MountedData`.
    "mounted",
    "router",
    "signals",
    "web",
] }
dioxus-code = { version = "0.1.2", default-features = false, features = [
    "lang-json",
    "macro",
    "runtime",
] }
dioxus-code-editor = { version = "0.1.2", default-features = false }
# The `dioxus-field` convention the daisyUI registry components speak. Pinned to
# the version the registry's manifests declare so that the copied components and
# the `schemaform_daisyui` mapping compile against one `Binding`/`FieldMetaValues`.
dioxus-field = "0.7.0"
# Git-only behaviour crate the registry components are built on, at the revision
# their manifests pin. It exists only in this demo workspace; the published
# schemaform crates never depend on it.
dioxus-primitives = { version = "0.0.1", git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", default-features = false, features = [
    "router",
] }
serde_json = "1"
# `dioxus-web` uses `Window.location` but does not enable the corresponding
# web-sys feature itself. `console` is where the examples report form operation
# failures in the browser.
web-sys = { version = "0.3", features = ["Location", "Window", "console"] }

[dev-dependencies]
# Native tests observe the daisyUI renderer through the markup it produces.
dioxus-ssr = "=0.7.10"

[profile.wasm-dev]
inherits = "dev"
debug = false

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = false
incremental = false

[workspace]
