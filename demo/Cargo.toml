[package]
name = "demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
schemaform = { path = "../crates/schemaform" }
schemaform-dioxus = { path = "../crates/schemaform-dioxus" }

dioxus = { version = "=0.7.9", default-features = false, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "launch",
    "macro",
    "router",
    "signals",
    "web",
] }
dioxus-code = { version = "0.1.2", default-features = false, features = [
    "lang-json",
    "macro",
    "runtime",
] }
dioxus-code-editor = { version = "0.1.2", default-features = false }
serde_json = "1"
# `dioxus-web` uses `Window.location` but does not enable the corresponding
# web-sys feature itself.
web-sys = { version = "0.3", features = ["Location", "Window"] }

[profile.wasm-dev]
inherits = "dev"
debug = false

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = false
incremental = false

[workspace]
